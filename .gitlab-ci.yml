image: python:3.10-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

stages:
  - lint
  - test

before_script:
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt

lint_and_typecheck:
  stage: lint
  script:
    - echo "Führe Flake8 Linter aus..."
    - flake8 trading_engine.py test_trading_engine.py --max-line-length=120
    - echo "Führe MyPy Type-Check aus..."
    - mypy trading_engine.py --ignore-missing-imports

run_tests:
  stage: test
  script:
    - echo "Führe Test-Suite mit Coverage aus..."
    - pytest test_trading_engine.py -v --cov=trading_engine --cov-report=term --cov-report=xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
